<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HelpingHarbor</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="icon" type="image" href="110355.png">
  </head>
  <body>
    <script src="script1.js"></script>
    <main>
      <div class="signin">
        <div class="signin-text">
          <h2>Login with HelpingHarbour</h2>
          <img src="110355.png" class="signlogo" /> <br />
          <input
            type="email"
            placeholder="Enter Your Email"
            id="signmail"
          /><br />
          <input
            type="password"
            placeholder="Enter Your Password"
            autocomplete="off"
          /><br />
          <button class="btn-sign"><a class="a" href="index.html">Enter</a></button>
          <hr />
          <p class="signin-or">Or <a href="signup.html">Sign-up</a></p>
          <a href="forgotpass.html">Forgot Password?</a>
        </div>
      </div>
      <style>
        .a{
          color: white;
          text-decoration: none;
        }

        .signin-text input {
          font-size: larger;
          padding: 5px;
          margin-top: 10px;
        }
        .btn-sign {
          font-size: larger;
        }
        .signin-text p {
          font-size: 1.3rem;
        }
        .signin-text h2 {
          font-size: xx-large;
        }
        .msg {
          font-size: larger;
        }
        .msg1 {
          font-size: larger;
        }
        .signin-text p {
          font-size: 1.3rem;
        }
        .signin-text a {
          font-size: 1.3rem;
        }
      </style>
    </main>
  </body>
</html>
