<!DOCTYPE html>
<html lang="en">
  <head>
    <style>
      .signinmail {
        width: 50vh;
        height: 40px;
        font-size: larger;
      }
      .signin-text h2 {
        font-size: xx-large;
      }
      .signin-or {
        font-size: 1.3rem;
      }
      .btn-sign {
        height: 5vh;
        font-size: larger;
      }
    </style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <script src="script.js"></script>
    <main>
      <div class="signin">
        <div class="signin-text">
          <h2>Change your password</h2>
          <img src="110355.png" class="signlogo" />
          <input
            type="number"
            class="signinmail"
            placeholder="Enter Your Phone Number"
            id="signmail"
            required
            minlength="10"
            maxlength="10"
          /><br />

          <button class="btn-sign"><a href="usersupport.html">Enter</a></button>
          <hr />
          <p class="signin-or">Or <a href="signup.html">Sign-up</a></p>
          <br />
        </div>
      </div>
    </main>
  </body>
</html>
