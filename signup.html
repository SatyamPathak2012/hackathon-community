<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <script src="script1.js"></script>
    <main>
      <div class="signin">
        <div class="signin-text">
          <h2>Sign up with HelpingHarbour</h2>
          <img src="110355.png" class="signlogo" /><br />

          <input type="email" placeholder="Enter Your Email" id="email" /><br />
          <input
            type="email"
            placeholder="Confirm Your Email"
            id="confirmEmail"
          /><br />

          <input
            type="password"
            placeholder="Enter Your Password"
            id="password"
            autocomplete="off"
            required
          /><br />

          <input
            type="password"
            placeholder="Confirm Your Password"
            id="confirmPassword"
            required
            autocomplete="off"
          /><br />

          <p id="msg" class="msg" style="color: red; font-size: 14px"></p>

          <p id="msg1" class="msg1" style="color: red; font-size: 14px"></p>
          <button class="btn-sign" onclick="validateForm()"><a class="a" href="index.html">Enter</a></button>
          <hr />
          <p class="signin-or">Or <a href="login.html">Login</a></p>
        </div>
      </div>
      <style>
        .signin-text input {
          font-size: larger;
          padding: 5px;
          margin-top: 10px;
        }
        .btn-sign {
          font-size: larger;
        }
        .signin-text p {
          font-size: 1.3rem;
        }
        .signin-text h2 {
          font-size: xx-large;
        }
        .msg {
          font-size: larger;
        }
        .msg1 {
          font-size: larger;
        }
        .a{
          color: white;
          text-decoration: none;
        }
      </style>
    </main>
  </body>
</html>
